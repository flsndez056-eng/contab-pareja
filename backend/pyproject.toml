[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "contab-pareja-api"
version = "0.1.0"
description = "API transaccional para aprobación de gastos en pareja"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]>=0.35,<0.36",
  "sqlalchemy[asyncio]==2.0.51",
  "psycopg[binary,pool]==3.3.4",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3",
  "pwdlib[argon2]==0.3.0",
  "PyJWT[crypto]>=2.10,<3",
  "firebase-admin>=7,<8",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2",
  "testcontainers[postgres]>=4.12,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true
