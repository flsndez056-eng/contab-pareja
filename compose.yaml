name: contab-pareja

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contab_pareja
      POSTGRES_USER: contab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contab -d contab_pareja"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://contab:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/contab_pareja
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.outbox"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://contab:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/contab_pareja
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

