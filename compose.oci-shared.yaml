services:
  postgres:
    mem_limit: 768m
    cpus: 0.50
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8100}:8000"
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 200
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  worker:
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 200
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    profiles: [standalone]
