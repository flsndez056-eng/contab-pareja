name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validar Docker Compose para OCI
        run: |
          docker compose --env-file .env.production.example -f compose.oci.yaml config --quiet
          docker compose --env-file .env.production.example -f compose.oci.yaml -f compose.oci-shared.yaml config --quiet

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: contab_pareja_test
          POSTGRES_USER: contab
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contab -d contab_pareja_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://contab:test-password@localhost:5432/contab_pareja_test
      TEST_DATABASE_URL: postgresql+psycopg://contab:test-password@localhost:5432/contab_pareja_test
      JWT_SECRET: test-secret-that-is-longer-than-sixty-four-characters-for-contab-pareja-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar backend
        run: pip install -e './backend[dev]'
      - name: Migraciones
        working-directory: backend
        run: alembic upgrade head
      - name: Calidad y pruebas
        working-directory: backend
        run: |
          ruff check .
          mypy app
          pytest --cov=app --cov-report=term-missing
      - name: Construir imagen
        run: docker build -t contab-pareja-api:test backend

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Compilar, probar y analizar
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
